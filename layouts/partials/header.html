<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="{{ "/" | relURL }}">{{ site.Title }}</a>
    <nav class="site-nav" aria-label="Main">
      {{- $page := . }}
      {{- range site.Menus.main }}
      <a href="{{ .URL }}"{{ if $page.IsMenuCurrent "main" . }} aria-current="page"{{ end }}>{{ .Name }}</a>
      {{- end }}
    </nav>
    <button class="theme-toggle" type="button" aria-label="Switch between light and dark theme">
      <span class="icon-sun">{{ partial "icon.html" "sun" }}</span>
      <span class="icon-moon">{{ partial "icon.html" "moon" }}</span>
    </button>
  </div>
</header>
