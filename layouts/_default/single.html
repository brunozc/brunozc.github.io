{{ define "main" }}
<article class="page">
  <header class="page-header">
    <h1>{{ .Title }}</h1>
    {{- with .Params.lead }}
    <p class="lead">{{ . | markdownify }}</p>
    {{- end }}
    {{- if .Params.toc }}
    <div class="toc" aria-label="On this page">{{ .TableOfContents }}</div>
    {{- end }}
  </header>
  <div class="prose">
    {{ .Content }}
  </div>
</article>
{{ end }}
